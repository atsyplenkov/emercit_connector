[workspace]
name = "emercit_connector"
channels = ["conda-forge"]
platforms = ["linux-64", "osx-64", "osx-arm64", "win-64"]

[dependencies]
python = "3.12.*"
requests = "*"
pytz = "*"
pymongo = "*"
tqdm = "*"
retrying = "*"
pandas = "!=1.3.0"
pylint = "*"

[tasks]
run-main = "python main.py"
run-provider = "python provider.py"
run-export = "python export.py"
lint = "pylint *.py"
check-env = "python -c \"import platform,sys; print(platform.platform()); print(sys.version)\""
